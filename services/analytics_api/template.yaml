AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AgriPrice Zambia - Service 6, Analytics API and nightly Athena aggregation (independently deployable stack)

Parameters:
  Env: { Type: String, AllowedValues: [dev, prod] }
  DeploymentType: { Type: String, Default: AllAtOnce }
  ChaosErrorRate: { Type: String, Default: "0" }
  LogRetentionDays: { Type: Number, Default: 14 }

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "agriprice-${Env}-analytics-shared"
      ContentUri: ../../shared
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete
    Metadata: { BuildMethod: python3.12, BuildArchitecture: arm64 }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/agriprice-${Env}-analytics-api", RetentionInDays: !Ref LogRetentionDays }
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/apigateway/agriprice-${Env}-analytics", RetentionInDays: !Ref LogRetentionDays }

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "agriprice-${Env}-analytics"
      StageName: live
      EndpointConfiguration: { Type: REGIONAL }
      TracingEnabled: true
      MinimumCompressionSize: 1024
      MethodSettings:
        - { ResourcePath: "/*", HttpMethod: "*", ThrottlingRateLimit: 20, ThrottlingBurstLimit: 40, MetricsEnabled: true }
      AccessLogSetting:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","route":"$context.resourcePath","status":"$context.status","latency":"$context.responseLatency","bytes":"$context.responseLength"}'

  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "agriprice-${Env}-analytics-api"
      Description: Seasonal price series, forecast and nightly Athena refresh
      CodeUri: .
      Handler: analytics_app.handler
      Runtime: python3.12
      Architectures: [arm64]
      Tracing: Active
      Timeout: 300
      MemorySize: 512
      Layers: [!Ref SharedLayer]
      LoggingConfig: { LogGroup: !Ref LogGroup }
      AutoPublishAlias: live
      DeploymentPreference: { Type: !Ref DeploymentType, Alarms: [!Ref ErrorsAlarm] }
      VpcConfig:
        SubnetIds: !Split [",", !ImportValue { "Fn::Sub": "agriprice-${Env}-PrivateSubnetIds" }]
        SecurityGroupIds: [!ImportValue { "Fn::Sub": "agriprice-${Env}-LambdaSgId" }]
      Environment:
        Variables:
          APP_ENV: !Ref Env
          TABLE_NAME: !ImportValue { "Fn::Sub": "agriprice-${Env}-TableName" }
          POWERTOOLS_SERVICE_NAME: analytics-api
          POWERTOOLS_METRICS_NAMESPACE: AgriPrice
          POWERTOOLS_LOG_LEVEL: INFO
          GLUE_DATABASE: !ImportValue { "Fn::Sub": "agriprice-${Env}-GlueDatabase" }
          ATHENA_WORKGROUP: !ImportValue { "Fn::Sub": "agriprice-${Env}-AthenaWorkGroup" }
          CHAOS_ERROR_RATE: !Ref ChaosErrorRate
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: SeriesCache
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !ImportValue { "Fn::Sub": "agriprice-${Env}-TableArn" }
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["SERIES#*"]
            - Sid: RunAggregation
              Effect: Allow
              Action: [athena:StartQueryExecution, athena:GetQueryExecution, athena:GetQueryResults, athena:StopQueryExecution]
              Resource: !Sub
                - "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${WG}"
                - WG: !ImportValue { "Fn::Sub": "agriprice-${Env}-AthenaWorkGroup" }
            - Sid: CatalogRead
              Effect: Allow
              Action: [glue:GetDatabase, glue:GetTable, glue:GetPartition, glue:GetPartitions, glue:BatchGetPartition]
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub ["arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${Db}", { Db: !ImportValue { "Fn::Sub": "agriprice-${Env}-GlueDatabase" } }]
                - !Sub ["arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${Db}/curated_prices", { Db: !ImportValue { "Fn::Sub": "agriprice-${Env}-GlueDatabase" } }]
            - Sid: LakeList
              Effect: Allow
              Action: [s3:ListBucket, s3:GetBucketLocation]
              Resource: !Sub ["arn:${AWS::Partition}:s3:::${Bucket}", { Bucket: !ImportValue { "Fn::Sub": "agriprice-${Env}-LakeBucket" } }]
            - Sid: ReadCuratedWriteResults
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
              Resource:
                - !Sub ["arn:${AWS::Partition}:s3:::${Bucket}/curated/*", { Bucket: !ImportValue { "Fn::Sub": "agriprice-${Env}-LakeBucket" } }]
                - !Sub ["arn:${AWS::Partition}:s3:::${Bucket}/athena-results/*", { Bucket: !ImportValue { "Fn::Sub": "agriprice-${Env}-LakeBucket" } }]
      Events:
        Series:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /analytics/series, Method: GET }
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(0 1 * * ? *)  # 03:00 in Lusaka
            Input: '{"action":"refresh"}'
            Description: Rebuild cached seasonal series from Athena
      Tags: { service: analytics-api, project: agriprice }

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "agriprice-${Env}-analytics-api-errors"
      AlarmDescription: "Analytics errors. Runbook: docs/runbooks.md#errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Sub "agriprice-${Env}-analytics-api" }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "agriprice-${Env}-AlarmTopicArn" }]

Outputs:
  ApiId:
    Value: !Ref Api
    Export: { Name: !Sub "agriprice-${Env}-AnalyticsApiId" }
  FunctionName:
    Value: !Ref Function
    Export: { Name: !Sub "agriprice-${Env}-AnalyticsFunctionName" }
