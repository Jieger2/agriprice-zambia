AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AgriPrice Zambia - network. VPC across two Availability Zones with private
  subnets for every Lambda function, free S3/DynamoDB gateway endpoints, and a
  self-healing NAT instance instead of managed NAT Gateways (~$63/month saved).

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  EnableNat:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Outbound internet for ingestion (price sources), SMS, SSM, SQS, EventBridge, X-Ray.
  NatAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 arm64 (free-tier eligible), resolved from the public SSM parameter.
  NatInstanceType:
    Type: String
    Default: t4g.micro
    Description: Must be free-tier eligible on AWS Free plan accounts (t4g.micro, t4g.small, t3.micro, ...).

Conditions:
  UseNat: !Equals [!Ref EnableNat, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}" }]

  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}-public-a" }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}-public-b" }]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}-private-a" }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}-private-b" }]

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRt }
  PublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRt }

  PrivateRtA:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc, Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}-private-a" }] }
  PrivateRtB:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc, Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}-private-b" }] }
  PrivateAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRtA }
  PrivateAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRtB }

  # Free gateway endpoints: S3 and DynamoDB traffic never touches the NAT.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRtA, !Ref PrivateRtB]
  DynamoEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRtA, !Ref PrivateRtB]

  LambdaSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions - no inbound, HTTPS outbound only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS to AWS APIs, price sources and SMS gateway" }

  # ---------------- NAT instance: one t4g.micro (Amazon Linux 2023) in an Auto Scaling group,
  # configured like fck-nat (https://fck-nat.dev) by the user data below.
  # A static ENI carries the private route; if the instance dies the ASG replaces
  # it and the new instance re-attaches the ENI, so routes never change.
  NatSg:
    Type: AWS::EC2::SecurityGroup
    Condition: UseNat
    Properties:
      GroupDescription: NAT instance - accepts traffic from the VPC only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: "-1", CidrIp: !Ref VpcCidr, Description: NAT traffic from private subnets }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: Internet egress }
  NatEni:
    Type: AWS::EC2::NetworkInterface
    Condition: UseNat
    Properties:
      SubnetId: !Ref PublicSubnetA
      GroupSet: [!Ref NatSg]
      SourceDestCheck: false
      Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}-nat" }]
  NatRole:
    Type: AWS::IAM::Role
    Condition: UseNat
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: attach-static-eni
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ec2:AttachNetworkInterface, ec2:ModifyNetworkInterfaceAttribute, ec2:ModifyInstanceAttribute]
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/${NatEni}"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
  NatProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: UseNat
    Properties: { Roles: [!Ref NatRole] }
  NatLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: UseNat
    Properties:
      LaunchTemplateData:
        ImageId: !Ref NatAmiId
        InstanceType: !Ref NatInstanceType
        IamInstanceProfile: { Arn: !GetAtt NatProfile.Arn }
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref NatSg]
            SubnetId: !Ref PublicSubnetA
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # NAT on Amazon Linux 2023: take over the static ENI, forward and masquerade VPC traffic.
            set -uxo pipefail
            T=$(curl -sX PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/instance-id)
            sysctl -w net.ipv4.ip_forward=1
            echo "net.ipv4.ip_forward=1" > /etc/sysctl.d/90-nat.conf
            for f in /proc/sys/net/ipv4/conf/*/rp_filter; do echo 0 > "$f"; done
            echo "net.ipv4.conf.all.rp_filter=0" >> /etc/sysctl.d/90-nat.conf
            aws ec2 modify-instance-attribute --region ${AWS::Region} --instance-id "$IID" --no-source-dest-check
            for i in $(seq 1 30); do
              aws ec2 attach-network-interface --region ${AWS::Region} --instance-id "$IID" --network-interface-id ${NatEni} --device-index 1 && break
              sleep 10   # the previous instance may still be releasing the ENI
            done
            dnf install -y iptables-nft
            OUT=$(ip route show default | awk '{print $5; exit}')
            iptables -t nat -A POSTROUTING -o "$OUT" -s ${VpcCidr} -j MASQUERADE
            iptables -P FORWARD ACCEPT
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: !Sub "agriprice-${Env}-nat" }]
  NatAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: UseNat
    Properties:
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref PublicSubnetA]
      LaunchTemplate: { LaunchTemplateId: !Ref NatLaunchTemplate, Version: !GetAtt NatLaunchTemplate.LatestVersionNumber }
      HealthCheckType: EC2
  PrivateDefaultA:
    Type: AWS::EC2::Route
    Condition: UseNat
    Properties: { RouteTableId: !Ref PrivateRtA, DestinationCidrBlock: 0.0.0.0/0, NetworkInterfaceId: !Ref NatEni }
  PrivateDefaultB:
    Type: AWS::EC2::Route
    Condition: UseNat
    Properties: { RouteTableId: !Ref PrivateRtB, DestinationCidrBlock: 0.0.0.0/0, NetworkInterfaceId: !Ref NatEni }

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "agriprice-${Env}-VpcId" }
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub "agriprice-${Env}-PrivateSubnetIds" }
  LambdaSgId:
    Value: !Ref LambdaSg
    Export: { Name: !Sub "agriprice-${Env}-LambdaSgId" }
  NatEnabled:
    Value: !If [UseNat, "true", "false"]
