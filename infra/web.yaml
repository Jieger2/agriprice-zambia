AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AgriPrice Zambia - web front door. Private S3 bucket + CloudFront (Origin Access
  Control) serving the 2G-friendly web app, and routing /api/* and /analytics/*
  to their API Gateway origins so everything is same-origin (no CORS round trips).
  Public price responses (Cache-Control: public, max-age=300) are cached at the edge.

Parameters:
  Env: { Type: String, AllowedValues: [dev, prod] }

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "agriprice-${Env}-web-${AWS::AccountId}"
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "agriprice-${Env}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "agriprice-${Env}-api"
        Comment: Honour origin Cache-Control; Authorization in the key so private responses are never shared
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: whitelist, Headers: [Authorization] }
          QueryStringsConfig: { QueryStringBehavior: all }
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "agriprice-${Env}-api"
        CookiesConfig: { CookieBehavior: none }
        HeadersConfig: { HeaderBehavior: whitelist, Headers: [Idempotency-Key, If-None-Match, X-Correlation-Id, Content-Type] }
        QueryStringsConfig: { QueryStringBehavior: all }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "AgriPrice Zambia (${Env})"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200  # includes African edge locations; PriceClass_100 does not
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: listings
            DomainName: !Sub ["${Id}.execute-api.${AWS::Region}.amazonaws.com", { Id: !ImportValue { "Fn::Sub": "agriprice-${Env}-ListingsApiId" } }]
            OriginPath: /live
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
          - Id: analytics
            DomainName: !Sub ["${Id}.execute-api.${AWS::Region}.amazonaws.com", { Id: !ImportValue { "Fn::Sub": "agriprice-${Env}-AnalyticsApiId" } }]
            OriginPath: /live
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: listings
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /analytics/*
            TargetOriginId: analytics
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        ViewerCertificate: { CloudFrontDefaultCertificate: true }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition: { StringEquals: { AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}" } }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "agriprice-${Env}-web"
      UserPoolId: !ImportValue { "Fn::Sub": "agriprice-${Env}-UserPoolId" }
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, phone, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${Distribution.DomainName}/"]
      LogoutURLs: [!Sub "https://${Distribution.DomainName}/"]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 8
      AccessTokenValidity: 8
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  WebBucketName:
    Value: !Ref WebBucket
  WebClientId:
    Value: !Ref WebClient
